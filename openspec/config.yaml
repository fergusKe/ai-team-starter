schema: spec-driven

context: |
  Language: zh-TW
  All artifacts must be written in zh-TW.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  This project reviews specs on a draft PR before any implementation.
  Specs are read by teammates who were not in the conversation that produced
  them: never rely on context that only exists in chat.

rules:
  proposal:
    - 必須寫「不做什麼」（Non-goals）。沒寫的話，之後一定有人順手做掉。
    - 「為什麼現在做」要能回答「不做會怎樣」，不是只描述功能。

  specs:
    - 主 spec 的 `## Purpose` 至少要 50 個字元。**中文特別容易踩到這條** ——
      英文 50 字元約 8 個單字，中文 50 字是兩三句話。寫成一句話會不夠。
      這條在 change 階段驗不出來，是 archive 之後 main spec 才會紅，
      也就是 PR 全綠、合併後 main 才爆。所以一開始就要寫夠。
    - 每條 Requirement 至少要有一個 Scenario；沒有 Scenario 的需求不可測試。
    - 除了正常路徑，必須有**失敗路徑**的 Scenario：輸入不合法、權限不足、
      資源不存在、超過上限時會怎樣。
    - |
      **失敗路徑的 Scenario 要寫出失敗之後什麼 SHALL NOT 改變**（資料、狀態、
      畫面上已經有的東西）。只寫「會明確失敗」的話，測試的人只能自己猜要驗什麼；
      猜不到的那種缺陷（例如失敗之後「下一頁」拿失敗的那一頁當跳板）會在
      Scenario 缺口報告的「已覆蓋」底下靜靜通過。
    - |
      **一個 Scenario 一個動作**：只有一個 `WHEN`、沒有 `AND WHEN`；`THEN` 後面
      接一個會改變狀態的 `AND`（「再按一次上一頁」）也是第二個動作。判準：
      **只把其中一個結果改壞，這條 Scenario 還會過嗎？會就拆。** 拆法是把前面的
      動作改寫成已經發生的前提（`GIVEN`）。
      **只適用新寫的 Scenario**：main 上的 ID 不改（要拆只能 REMOVED＋ADDED），
      不要為了這條回頭拆既有的。
    - 數值限制與預設值要寫進 Requirement 本身（長度、頻率、逾時、筆數上限），
      不要留給實作決定。
    - |
      每個 Scenario 標一個穩定 ID，放在標題最前面的中括號裡：

          #### Scenario: [AUTH-01-S01] 首次登入建立 session

      格式是 `<工作項目 ID>-S<兩位數>`，同一個 change 內不重複。
      前綴用你們工作分解表裡的 ID —— 這樣規格、任務、之後的測試
      三邊講的是同一個東西。沒有工作分解表就用 capability 名稱。
      **ID 一旦寫進 main 就不要改** —— 之後測試會用它對應回來，
      改 ID 等於把那條對應關係悄悄拆掉。
    - |
      權限、併發、相容性這三項**不要在每條 Requirement 裡各寫一次
      「不適用」**。整份 delta spec 最上面放一個 Applicability 區塊，
      寫一次就好：

          ## Applicability
          權限：不適用 —— 本 change 不做授權判斷
          併發：適用 —— render loop 與 network snapshot 同時寫入
          持久資料相容性：不適用 —— 不讀寫持久資料
          失敗路徑：適用 —— WebGL 不可用、WS 斷線、payload 不合法

      逐條重複「不適用：純前端渲染」會讓每份規格多出三五行沒有資訊的字，
      而 reviewer 會學會跳過那幾段 —— **然後連夾在中間真正的 Scenario
      也一起跳過**。這個 repo 的信任錨是人讀規格，不要訓練他們略讀。
    - Requirement 本身只寫真正適用、而且能被一個 Scenario 證明的事。
    - |
      **這個 change 的測試會連到什麼，要寫出來。** 完全不連外部服務就明寫
      「不適用：測試不連任何外部服務」。

      要連的話寫清楚是哪一種：本機起的可拋棄實例、當次建立當次銷毀的
      ephemeral、還是 loopback。**不可以是團隊共用的任何一份** ——
      判準見 AGENTS.md〈測試環境隔離〉。

      留白的話，實作的人會用手邊最方便的那個位址，而那通常是共用的。
    - 「使用者體驗要好」不是需求。每條都要能被一個 Scenario 證明。

  design:
    - 只寫難逆轉、有取捨的決定。選了什麼、代價是什麼。
    - |
      **還不知道答案的常數不要寫進 Requirement。** threshold、係數、
      collider 形狀這種要靠實作量出來的東西，列成 design 的待答問題。
      把猜測寫成「需求」之後，實作只會回頭去改那個數字，規格 review 就白做了。
      量出來之後如果它改變了某條 Requirement 或 Scenario，
      **回去重開 spec PR 讓人重新批准**，不要就地改。
    - 用什麼 log 套件不用寫；資料放哪、認證怎麼做要寫。
    - 重大決策同時在 `docs/adr/` 留一份 ADR，因為 change 會被 archive，ADR 不會。
    - |
      每條決策一個標題：`## D1｜標題`（`##` 或 `###` 都可以，分隔符用 `｜`）。
      `bash .github/scripts/arch-view.sh --decisions` 會跨所有 change 把它們列出來。
      實作之後補的心得寫成 `### D1 補記：…`，會掛在原決策底下。
      取代之前某條決策時明寫 `- **Supersedes**: <change-id>/D<n>`（change-id 不含日期前綴）——
      **沒寫就不推斷**：兩條講同一件事的決策，除非明說，否則機器當它們不相關。
    - 是**系統之間的邊界**（誰能 import 誰、訊息只能走哪條路、高頻資料放哪）的決策，
      ADR 要多標 `邊界狀態` 與 `證據`，規則見 `docs/adr/README.md`。

  tasks:
    - 每條任務要對應到 specs 裡的某一條 Requirement。對不上的任務就是範圍蔓延。
    - 第一條任務永遠是「規格已在 PR 上談定」。

operations:
  apply:
    guidance:
      - 先寫測試再寫實作。測試對應 Scenario。
      - |
        失敗路徑的測試要驗 Scenario 寫的「失敗之後什麼不能變」，不是只驗錯誤碼或
        錯誤訊息。`if (錯誤訊息看得到) { 驗它 }` 這種斷言，錯誤沒出現時直接通過；
        `catch {}` 把斷言失敗吞掉也一樣 —— 它們只有突變抓得到（把產品碼的拒絕
        拿掉，這條測試還綠就是空的）。
      - 發現規格有問題就停下來講，在 PR 上改規格 ——
        不要一邊寫一邊把規格調整成已經寫出來的樣子。
  archive:
    guidance:
      - archive 前確認 CI 是綠的，而且實作 PR 已經合併。
      - |
        archive 走自己的分支 `archive/<change-id>`，是獨立的一個 PR。
        沒有這個類別它開不出來 —— spec/ 超出範圍、feat/ 禁止刪 specs、
        chore/ 禁止碰 openspec。
      - |
        **archive 產生的 main spec，Purpose 會是
        「TBD - created by archiving change ...」，一定要改掉。**
        不改的話 `validate --all --strict` 會紅。這是實測過的必然，
        不是偶發 —— archive 之後那一關立刻 exit 1。
      - sync 到 `openspec/specs/` 之後，那份才是「系統現在是什麼樣子」的答案。
      - |
        archive PR 的 diff 會顯示 `openspec/specs/` 被改成什麼樣子。
        **那是整個流程裡唯一能看見「兩個 change 互相覆蓋」的地方**，
        要把它當規格 diff 來讀，不是當機器產生的雜訊。
